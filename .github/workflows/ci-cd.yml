name: Automation Testing and Deployment

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # 1. 執行 Coding Test 階段
  run-test:
    runs-on: ubuntu-latest
    # 修改 .github/workflows/ci-cd.yml 中的 run-test 區塊
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 💡 新增這步：告訴雲端機器人根據 package.json 安裝 Jest 測試環境
      - name: Install dependencies
        run: npm install

        # 💡 終極解法：在跑測試前，強行把 node_modules 內所有執行檔的權限開通（可執行 +x）
      - name: Fix Node Binaries Permissions
        run: chmod -R +x node_modules/.bin

      # 💡 修改這步：讓機器人執行 npm test (也就是啟動 Jest 跑 test.js)
      - name: Run Jest Test Suite
        run: npm test

  # 2. 部署到 GitHub Pages 階段
  deploy:
    needs: run-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 部署根目錄下的 index.html